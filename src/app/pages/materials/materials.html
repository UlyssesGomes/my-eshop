<app-content-panel>
    <div class="flex justify-between">
        <h2 class="mb-3">Materiais</h2>
        <button pButton pRipple type="button" icon="pi pi-plus" rounded (click)="goToNewMaterial()"></button>
    </div>

    @if(totalElements > 0) {
        <app-u-table [items]="paginatedMaterials" [columnsWidth]="columnsWidth" [showActionColumn]="true" [size]="undefined"
        (columnAction)="columnActionEvent($event)"></app-u-table>
    } @else {
        <p>Nenhum Material foi cadastrado ainda.</p>
    }

    @if(totalElements > 0) {
        <p-paginator (onPageChange)="onPageChange($event)" [first]="first" [rows]="pageSize" [totalRecords]="totalElements" [rowsPerPageOptions]="[10, 20, 30]" />
    }
</app-content-panel>
<p-confirmdialog />
