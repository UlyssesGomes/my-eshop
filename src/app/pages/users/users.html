<app-content-panel>
    <div class="flex justify-between">
        <h2 class="mb-3">Usuários</h2>
        <button pButton pRipple type="button" icon="pi pi-plus" rounded (click)="goToNewUser()"></button>
    </div>

    <app-u-table [items]="paginatedUsers" [columnsWidth]="columnsWidth" [columns]="columnNames" (columnAction)="columnActionEvent($event)" [showActionColumn]="true"></app-u-table>

    <div class="flex items-center justify-end">
        <span class="mx-1 text-color">Items per page: </span>
        <p-select [options]="paginationOptions" optionLabel="label" optionValue="value" [(ngModel)]="rows"
            (ngModelChange)="first = 0" (onChange)="onPageFrameSize()"/>
        <p-paginator [first]="first" [rows]="rows" [totalRecords]="users.length" (onPageChange)="onPageChange($event)"
            [showCurrentPageReport]="true" currentPageReportTemplate="{first} - {last} of {totalRecords}"
            [showPageLinks]="false" [showFirstLastIcon]="false"></p-paginator>
    </div>
</app-content-panel>
