<app-content-panel>
    <h2>Camisetas</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-4">
        @for (product of productList; track product.id) {
        <app-item-card-list [item]="product" (favoriteButton)="addFavoriteItem(product)" />
        }
    </div>
</app-content-panel>
