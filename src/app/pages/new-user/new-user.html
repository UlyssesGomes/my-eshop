<app-content-panel>
    <div>
        <h3>Cadastro de Novo Usuário</h3>
    </div>
    <form [formGroup]="form" (submit)="save()">
        <div class="my-3">
            <!-- 
            // -----------------------------------------------------------------------------------------------------
            // INPUT USER NAME
            // ----------------------------------------------------------------------------------------------------- 
            -->
            <p-floatlabel variant="on">
                <input pInputText id="name" formControlName="name" fluid="true" />
                <label class="label-background font-semibold" for="name">Nome Completo</label>
            </p-floatlabel>
            <p-message *ngIf="form.get('name')?.errors && !form.get('name')?.pristine && form.get('name')?.touched"
                severity="error" size="small" variant="simple" icon="pi pi-exclamation-triangle">{{
                form.get('name')?.errors | errorReader}}</p-message>
        </div>

        <div class="my-3">
            <!-- 
            // -----------------------------------------------------------------------------------------------------
            // INPUT EMAIL
            // ----------------------------------------------------------------------------------------------------- 
            -->
            <p-floatlabel variant="on">
                <input pInputText id="email" formControlName="email" fluid="true" />
                <label class="label-background font-semibold" for="email">Email</label>
            </p-floatlabel>
            <p-message *ngIf="form.get('email')?.errors && !form.get('email')?.pristine && form.get('email')?.touched"
                severity="error" size="small" variant="simple" icon="pi pi-exclamation-triangle">{{
                form.get('email')?.errors | errorReader}}</p-message>
        </div>
        <div class="my-3">
            <!-- 
            // -----------------------------------------------------------------------------------------------------
            // INPUT CONFIRM EMAIL
            // ----------------------------------------------------------------------------------------------------- 
            -->
            <p-floatlabel variant="on">
                <input pInputText formControlName="confirmEmail" id="confirm-email" fluid="true" />
                <label class="label-background font-semibold" for="confirm-email">Confirme o Email</label>
            </p-floatlabel>
            <p-message *ngIf="form.get('confirmEmail')?.errors && !form.get('confirmEmail')?.pristine && form.get('confirmEmail')?.touched"
                severity="error" size="small" variant="simple" icon="pi pi-exclamation-triangle">{{
                form.get('confirmEmail')?.errors | errorReader}}</p-message>
        </div>
        <div class="my-3">
            <!-- 
            // -----------------------------------------------------------------------------------------------------
            // INPUT PASSWORD
            // ----------------------------------------------------------------------------------------------------- 
            -->
            <p-floatlabel variant="on">
                <p-password inputId="password" formControlName="password" fluid="true" [toggleMask]="true" />
                <label class="label-background font-semibold" for="password">Senha</label>
            </p-floatlabel>
            <p-message
                *ngIf="form.get('password')?.errors && !form.get('password')?.pristine && form.get('password')?.touched"
                severity="error" size="small" variant="simple" icon="pi pi-exclamation-triangle">{{
                form.get('password')?.errors | errorReader}}</p-message>
        </div>
        <div class="my-3">
            <!-- 
            // -----------------------------------------------------------------------------------------------------
            // INPUT CONFIRM PASSWORD
            // ----------------------------------------------------------------------------------------------------- 
            -->
            <p-floatlabel variant="on">
                <p-password inputId="confirm-password" formControlName="confirmPassword" fluid="true" [toggleMask]="true" />
                <label class="label-background font-semibold" for="confirm-password">Confirme a Senha</label>
            </p-floatlabel>
            <p-message
                *ngIf="form.get('confirmPassword')?.errors && !form.get('confirmPassword')?.pristine && form.get('confirmPassword')?.touched"
                severity="error" size="small" variant="simple" icon="pi pi-exclamation-triangle">{{
                form.get('confirmPassword')?.errors | errorReader}}</p-message>
        </div>
        <div class="my-7 flex flex-row-reverse">
            <p-button class="show-element-md button-min-width-size" type="submit" [disabled]="form.invalid"
                label="Salvar" fluid="false" areaLabel="Salvar"></p-button>
            <p-button class="hide-element-md flex-grow" type="submit" [disabled]="form.invalid" label="Salvar"
                fluid="true" areaLabel="Salvar"></p-button>
        </div>
    </form>
</app-content-panel>
