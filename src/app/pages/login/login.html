<div class="fixed start-3 top-3">
    <a class="clean-button flex items-center px-6" routerLink="/">
        <i class="me-2 pi pi-arrow-left text-xl md:text-lg"></i>
        <span class="font-bold underlined-button">Voltar</span>
    </a>
</div>
<div class="h-screen flex flex-col lg:flex-row items-center lg:justify-center">
    <div class="me-2 lg:me-7 show-element-lg">
        <img src="resources/images/logo/logo-wire.png" alt="Logo da marca Sua Estampa.">
    </div>
    <div class="mt-5 me-2 lg:me-7 hide-element-lg">
        <img style="width:340px;" src="resources/images/logo/logo-wire.png" alt="Logo da marca Sua Estampa.">
    </div>
    <div class="login-pane">
        <h2 class="mt-3 mb-8 text-center">Sua Estampa</h2>
        <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="my-3">
                <p-floatlabel variant="on">
                    <input pInputText id="e-mail" formControlName="email" fluid="true" />
                    <label class="login-label-background font-semibold" for="e-mail">Email</label>
                </p-floatlabel>
                <p-message
                    *ngIf="form.get('email')?.errors && !form.get('email')?.pristine && form.get('email')?.touched"
                    severity="error" size="small" variant="simple" icon="pi pi-exclamation-triangle">{{
                    form.get('email')?.errors | errorReader}}</p-message>
            </div>
            <div class="my-3">
                <p-floatlabel variant="on">
                    <p-password id="password" formControlName="password" fluid="true" variant="outlined"
                        [toggleMask]="true" [feedback]="false" />
                    <label class="login-label-background font-semibold" for="password"
                        aria-describedby="password-help">Senha</label>
                </p-floatlabel>
                <p-message
                    *ngIf="form.get('password')?.errors && !form.get('password')?.pristine && form.get('password')?.touched"
                    severity="error" size="small" variant="simple" icon="pi pi-exclamation-triangle">{{
                    form.get('password')?.errors | errorReader}}</p-message>
            </div>
            <div class="my-7">
                <p-button type="submit" [disabled]="form.invalid" label="Entrar" fluid="true"
                    areaLabel="Entrar"></p-button>
            </div>
        </form>
        <p-divider />
        <div class="flex justify-between">
            <a class="clean-button underlined-button" routerLink="/novo-usuario">Criar conta</a>
            <a class="clean-button underlined-button">Esqueci a senha</a>
        </div>
    </div>
</div>
