<div class="panel-3d">
    <div class="gallery" [ngClass]="currentImg">

        @for (highlight of highlights; track highlight.id) {
            <div><a (click)="selectImage(1)"><img [src]="highlight.img"></a></div>
        }
    </div>
</div>
<div class="flex justify-center">

    @for (item of buttonArray; track $index) {
        <button class="clean-button index-button m-4" [ngClass]="{'selected': item == selectedImgIndex}"
            (click)="next(item)"></button>
    }
</div>
