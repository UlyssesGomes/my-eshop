<div class="card-item relative">
    <div class="flex-grow flex flex-col justify-center content-center" style="flex-grow: 1;">
        @if(loading) {
            <p-progress-spinner ariaLabel="loading" />
        } @else {
            <img [src]="img" [alt]="item?.name" (click)="imageZoom()">
        }
    </div>
    <p-rating class="my-2" [(ngModel)]="item!.rate" [readonly]="true" />
    <h3 class="font-semibold mb-2 ellipsis" [title]="item?.name">{{item?.name}}</h3>
    <div class="flex justify-between items-center">
        <span class="font-semibold text-primary">{{item?.price | currency:'BRL':'symbol':'1.2-2'}}</span>
    </div>
    <div class="absolute favorite-button-position">
        <p-button icon="pi pi-trash" [rounded]="true" [raised]="true" [text]="true" severity="danger" (click)="delete()" />
        <p-button icon="pi pi-pencil" [rounded]="true" [raised]="true" [text]="true" severity="success" (click)="edit()" />
    </div>
</div>
<p-dialog [header]="item?.name" [(visible)]="visible" [modal]="true" [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
    [draggable]="false" [resizable]="false">
    <img [src]="img" [alt]="item?.name">
</p-dialog>
